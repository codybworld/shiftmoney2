<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShiftMoney">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230c0a08'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23f3ca85' font-family='Georgia' font-weight='bold'%3E$%3C/text%3E%3C/svg%3E">
<title>ShiftMoney</title>
<style>
:root{color-scheme:dark;--bg:#0c0a08;--line:#3d2f24;--text:#fff7ec;--muted:#c4ab94;--gold:#f3ca85;--gold2:#e09f4b;--red:#ff9478;--green:#8ce6a3;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(243,202,133,.12),transparent 50%),var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom));min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
h1{font-size:26px;margin:0;letter-spacing:-.8px}h2{font-size:18px;margin:0;letter-spacing:-.2px}
header{padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between}
.wrap{padding:0 15px;max-width:600px;margin:auto}
.page{display:none}.page.active{display:block;animation:in .3s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(145deg,rgba(33,25,19,.96),rgba(20,15,12,.96));border:1px solid rgba(243,202,133,.16);border-radius:22px;padding:18px;margin-bottom:14px}
.hero{background:radial-gradient(circle at 100% 0,rgba(243,202,133,.2),transparent 50%),linear-gradient(130deg,rgba(90,58,34,.8),rgba(23,17,13,.98) 70%);border-color:rgba(243,202,133,.38)}
.money{font-size:clamp(40px,12vw,54px);font-weight:800;letter-spacing:-1.8px;font-variant-numeric:tabular-nums;line-height:1.1}
.muted{color:var(--muted)}.small{font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(46,36,28,.7);border:1px solid rgba(243,202,133,.12);border-radius:15px;padding:13px;min-width:0}
.stat .n{font-size:22px;font-weight:750;margin-top:3px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.pos{color:var(--gold)}.neg{color:var(--red)}.grn{color:var(--green)}
.btn{border:1px solid rgba(243,202,133,.28);background:rgba(51,40,32,.95);border-radius:14px;padding:13px 16px;font-weight:650;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.96);filter:brightness(1.2)}
.btn.primary{background:linear-gradient(110deg,var(--gold),var(--gold2));border:0;color:#18110b}
.btn.danger{color:var(--red);border-color:rgba(255,148,120,.35)}.btn.full{width:100%}.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>.btn{flex:1}
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:13px;color:var(--muted)}
input,select{width:100%;border:1px solid rgba(243,202,133,.25);background:rgba(13,10,8,.9);border-radius:12px;padding:14px;min-width:0;font-size:17px}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(243,202,133,.15)}
.li{padding:13px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0;padding-bottom:0}.li:first-child{padding-top:0}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;background:rgba(243,202,133,.15);color:var(--gold);white-space:nowrap}.pill.red{background:rgba(255,148,120,.15);color:var(--red)}.pill.grn{background:rgba(140,230,163,.15);color:var(--green)}
.meter{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:12px}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .6s var(--ease)}
.empty{padding:16px 4px;color:var(--muted);text-align:center}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.nav{position:fixed;bottom:0;left:0;right:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(12,10,8,.92);border-top:1px solid rgba(243,202,133,.2);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:10;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.nav button{border:0;background:none;color:var(--muted);padding:7px 0;font-size:12px;border-radius:12px;transition:all .2s}.nav button span{display:block;font-size:21px}.nav button.active{color:var(--gold);background:rgba(243,202,133,.12)}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:auto;background:#1b1510;border:1px solid rgba(243,202,133,.25);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));z-index:51;transform:translateY(105%);transition:transform .35s var(--ease);max-height:90vh;overflow:auto}
#sheet.on{transform:none}.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:15px;right:15px;max-width:480px;margin:auto;background:linear-gradient(100deg,var(--gold),var(--gold2));color:#18110b;padding:13px 16px;border-radius:14px;font-weight:700;z-index:60;opacity:0;transform:translateY(14px);transition:all .3s var(--ease);pointer-events:none;text-align:center}.toast.on{opacity:1;transform:none}
#splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(243,202,133,.22),transparent 65%),#0c0a08;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .5s,transform .5s}#splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
.logo{font-size:44px;font-weight:850;background:linear-gradient(110deg,#fff7ec 10%,var(--gold) 50%,var(--gold2) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1.5px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash"><div class="logo">ShiftMoney</div><div style="font-weight:600;margin:6px 0 4px">An Application by Cody B</div><div class="muted small" style="margin-bottom:30px">Copyright 2026</div><button class="btn primary" style="padding:14px 42px;font-size:17px" onclick="splashOut()">Enter</button></div>

<header><h1 id="appTitle">ShiftMoney</h1><button class="btn sm" onclick="settings()">⚙ Settings</button></header>

<main class="wrap">
<section id="home" class="page active">
 <div class="card hero">
  <div class="row"><div class="muted small">Total balance</div><button class="btn sm" onclick="setBalance()">✎ Update</button></div>
  <div class="money" id="bal">$0.00</div>
  <div class="small" id="afterBills" style="margin-top:6px"></div>
 </div>
 <div class="card">
  <div class="row"><h2>Bills due in <span id="mName"></span></h2><span class="pill" id="duePill"></span></div>
  <div class="g2" style="margin-top:14px"><div class="stat"><div class="muted small">Left to pay</div><div class="n neg" id="dueLeft"></div></div><div class="stat"><div class="muted small">Still need to earn</div><div class="n pos" id="toEarn"></div></div></div>
  <div class="meter"><span id="dueBar" style="width:0"></span></div><div class="small muted" id="dueLbl" style="margin-top:7px"></div>
  <div class="small" id="shiftsNeed" style="margin-top:10px"></div>
 </div>
 <div class="card"><div class="row" style="margin-bottom:12px"><h2>Unpaid this month</h2><span class="pill" id="dueCnt"></span></div><div id="dueList"></div></div>
 <div class="card"><div class="row"><h2>This month's shifts</h2><span class="pill" id="mShifts"></span></div>
  <div class="g2" style="margin-top:14px"><div class="stat"><div class="muted small">Tips</div><div class="n pos" id="mTips"></div></div><div class="stat"><div class="muted small">Take-home</div><div class="n" id="mNet"></div></div></div>
  <button class="btn primary full" style="margin-top:14px" onclick="shiftSheet()">＋ Log a shift</button></div>
</section>

<section id="shifts" class="page">
 <button class="btn primary full" onclick="shiftSheet()">＋ Log a shift</button>
 <div class="g2" style="margin-top:14px"><div class="stat"><div class="muted small">This month take-home</div><div class="n pos" id="sMonth"></div></div><div class="stat"><div class="muted small">Tips per hour</div><div class="n" id="sTH"></div></div></div>
 <div class="sec"><h2>Shift history</h2><span class="pill" id="sCnt"></span></div>
 <div class="card" id="shList"></div>
</section>

<section id="bills" class="page">
 <button class="btn primary full" onclick="billSheet()">＋ Add a bill</button>
 <div class="g2" style="margin-top:14px"><div class="stat"><div class="muted small">Due this month</div><div class="n" id="bTot"></div></div><div class="stat"><div class="muted small">Still unpaid</div><div class="n neg" id="bLeft"></div></div></div>
 <div class="sec"><h2>All bills</h2><span class="pill" id="bCnt"></span></div>
 <div class="card" id="billList"></div>
</section>
</main>

<nav class="nav">
 <button class="active" data-p="home" onclick="go('home')"><span>⌂</span>Home</button>
 <button data-p="shifts" onclick="go('shifts')"><span>＄</span>Shifts</button>
 <button data-p="bills" onclick="go('bills')"><span>↗</span>Bills</button>
</nav>
<div id="sheetBg" onclick="closeSheet()"></div>
<div id="sheet"><div class="grab"></div><h2 id="shT" style="margin-bottom:6px"></h2><div id="shB"></div></div>
<div id="toast" class="toast"></div>

<script>
const KEY='shiftmoney_v5',$=id=>document.getElementById(id);
let today=new Date();
const pad=n=>String(n).padStart(2,'0'),isoD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);
const pd=s=>{if(!s)return null;const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addM=(d,n)=>{const x=new Date(d),dy=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(dy,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x};
const fd=s=>{const d=pd(s);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):''};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let S={name:'ShiftMoney',wage:10.7,taxRate:20,bills:[],workdays:{},shifts:[],tx:[]};

/* load keeps all your existing shifts, bills and balance */
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s){S={...S,...s};if(!Array.isArray(s.tx)){S.tx=[];if(+s.balance)S.tx.push({id:uid(),date:isoD(today),amt:+s.balance,label:'Opening balance',ref:'open'})}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderAll()}
const balance=()=>S.tx.reduce((s,t)=>s+(+t.amt||0),0);
function addTx(amt,label,ref,date){S.tx.push({id:uid(),date:date||isoD(today),amt:+amt,label,ref:ref||''})}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200);if(navigator.vibrate)navigator.vibrate(10)}
function splashOut(){$('splash').classList.add('out');sessionStorage.setItem('sm_in','1');setTimeout(()=>$('splash').style.display='none',500)}
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===id));window.scrollTo(0,0)}

/* sheets */
function closeSheet(){$('sheetBg').classList.remove('on');$('sheet').classList.remove('on')}
function sheet(title,fields,cb,btn,live){$('shT').textContent=title;
 $('shB').innerHTML=fields.map(f=>`<div class="field"><label>${f.l}</label>${f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}"${o[0]==f.v?' selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" step=".01" inputmode="${f.t==='number'?'decimal':'text'}" value="${esc(f.v??'')}" placeholder="${f.p||''}">`}</div>`).join('')+(live?'<div class="stat" id="liveBox" style="margin:12px 0"></div>':'')+`<button class="btn primary full" id="shGo" style="margin-top:6px">${btn||'Save'}</button>`;
 $('shGo').onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$('f_'+f.k).value);if(cb(v)!==false)closeSheet()};
 if(live){const u=()=>{const v={};fields.forEach(f=>v[f.k]=$('f_'+f.k).value);$('liveBox').innerHTML=live(v)};fields.forEach(f=>$('f_'+f.k).addEventListener('input',u));u()}
 $('sheetBg').classList.add('on');$('sheet').classList.add('on')}

/* balance */
function setBalance(){sheet('Update balance',[{k:'a',l:'What is in your account right now? ($)',t:'number',v:balance().toFixed(2)}],v=>{if(v.a===''||!isFinite(+v.a)){toast('Enter a number');return false}const d=+v.a-balance();if(Math.abs(d)>=.005)addTx(d,'Balance update','adj');save();toast('Balance updated')},'Save balance')}

/* bills */
function occ(b,from,to){const o=[];let d=pd(b.due);if(!d)return o;let g=0;while(d<from&&b.repeat!=='once'&&g++<800)d=b.repeat==='weekly'?addD(d,7):addM(d,1);g=0;while(d<=to&&g++<800){if(d>=from)o.push(isoD(d));if(b.repeat==='once')break;d=b.repeat==='weekly'?addD(d,7):addM(d,1)}return o}
const paid=(b,dt)=>(b.paidDates||[]).includes(dt);
function allOcc(from,to,unpaidOnly){return S.bills.flatMap(b=>occ(b,from,to).filter(d=>!unpaidOnly||!paid(b,d)).map(d=>({b,date:d,paid:paid(b,d)}))).sort((a,b)=>a.date.localeCompare(b.date))}
const mStart=()=>new Date(today.getFullYear(),today.getMonth(),1),mEnd=()=>new Date(today.getFullYear(),today.getMonth()+1,0);
function billSheet(id){const b=S.bills.find(x=>x.id===id)||{};sheet(id?'Edit bill':'Add a bill',[{k:'n',l:'Bill name',v:b.name,p:'Rent, phone…'},{k:'a',l:'Amount ($)',t:'number',v:b.amount},{k:'d',l:'Next due date',t:'date',v:b.due||isoD(today)},{k:'r',l:'Repeats',v:b.repeat||'monthly',o:[['monthly','Every month'],['weekly','Every week'],['once','One time']]}],v=>{if(!v.n.trim()||!v.d||v.a===''){toast('Fill in name, amount and date');return false}
 const nb={id:b.id||uid(),name:v.n.trim(),amount:+v.a,due:v.d,repeat:v.r,paidDates:b.paidDates||[]};S.bills=S.bills.filter(x=>x.id!==b.id);S.bills.push(nb);save();toast('Bill saved')})}
function payBill(id,dt){const b=S.bills.find(x=>x.id===id);if(!b)return;b.paidDates=b.paidDates||[];if(!b.paidDates.includes(dt))b.paidDates.push(dt);addTx(-b.amount,'Paid '+b.name,`bill:${id}:${dt}`);save();toast(b.name+' paid · balance updated')}
function unpayBill(id,dt){const b=S.bills.find(x=>x.id===id);if(!b)return;b.paidDates=(b.paidDates||[]).filter(x=>x!==dt);S.tx=S.tx.filter(t=>t.ref!==`bill:${id}:${dt}`);save();toast('Payment undone · balance restored')}
function delBill(id){if(!confirm('Delete this bill?'))return;S.bills=S.bills.filter(b=>b.id!==id);S.tx=S.tx.filter(t=>!t.ref.startsWith('bill:'+id+':'));save()}

/* shifts */
function net(s){const t=Math.min(100,Math.max(0,+(s.taxRate??S.taxRate)));return((+s.cash||0)+(+s.credit||0)+(+s.other||0)+(+s.hours||0)*(+S.wage||0))*(1-t/100)}
function shiftSheet(id){const s=S.shifts.find(x=>x.id===id)||{};
 sheet(id?'Edit shift':'Log a shift',[{k:'d',l:'Date',t:'date',v:s.date||isoD(today)},{k:'h',l:'Hours worked',t:'number',v:s.hours,p:'6.5'},{k:'c',l:'Cash tips ($)',t:'number',v:s.cash,p:'0'},{k:'r',l:'Credit tips ($)',t:'number',v:s.credit,p:'0'}],v=>{if(!v.d){toast('Choose a date');return false}
 const n={...s,id:s.id||uid(),date:v.d,hours:+v.h||0,cash:+v.c||0,credit:+v.r||0,other:+s.other||0,taxRate:s.taxRate??S.taxRate};
 S.shifts=S.shifts.filter(x=>x.id!==n.id);S.shifts.push(n);S.shifts.sort((a,b)=>b.date.localeCompare(a.date));
 S.tx=S.tx.filter(t=>t.ref!=='shift:'+n.id);addTx(net(n),`Shift · ${n.hours}h`,'shift:'+n.id,n.date);save();toast('Shift saved · +'+money(net(n))+' to balance')},'Save shift',
 v=>{const t={...s,hours:+v.h||0,cash:+v.c||0,credit:+v.r||0,taxRate:s.taxRate??S.taxRate};return`<div class="muted small">Estimated take-home</div><div class="n pos">${money(net(t))}</div>`})}
function delShift(id){if(!confirm('Delete this shift? Its pay comes off your balance.'))return;S.shifts=S.shifts.filter(s=>s.id!==id);S.tx=S.tx.filter(t=>t.ref!=='shift:'+id);save()}

/* settings */
function settings(){sheet('Settings',[{k:'w',l:'Hourly wage ($)',t:'number',v:S.wage},{k:'t',l:'Tax withholding (%)',t:'number',v:S.taxRate}],v=>{S.wage=+v.w||0;S.taxRate=Math.min(100,Math.max(0,+v.t||0));save();toast('Settings saved')});
 $('shB').insertAdjacentHTML('beforeend',`<div class="actions" style="margin-top:14px"><button class="btn" onclick="exportData()">Export backup</button><button class="btn" onclick="$('imp').click()">Import backup</button><input id="imp" type="file" accept="application/json" hidden onchange="importData(event)"></div><button class="btn danger full" style="margin-top:10px" onclick="resetApp()">Erase all data</button>`)}
function exportData(){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='shiftmoney-backup-'+isoD(today)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Backup exported')}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(KEY,JSON.stringify(JSON.parse(r.result)));load();closeSheet();save();toast('Backup restored')}catch(x){alert('Invalid backup file')}};r.readAsText(f)}
function resetApp(){if(!confirm('Erase all app data?'))return;localStorage.removeItem(KEY);location.reload()}

/* render */
function renderAll(){
 const b=balance(),ms=isoD(mStart()),me=isoD(mEnd()),mon=today.toLocaleDateString('en-US',{month:'long'});
 $('appTitle').textContent=S.name||'ShiftMoney';
 const all=allOcc(mStart(),mEnd(),false),unp=all.filter(o=>!o.paid),tot=all.reduce((s,o)=>s+o.b.amount,0),left=unp.reduce((s,o)=>s+o.b.amount,0),gap=Math.max(0,left-b);
 $('bal').textContent=money(b);$('bal').className='money'+(b<0?' neg':'');
 $('afterBills').innerHTML=left?`<span class="${b-left<0?'neg':'grn'}">${money(b-left)}</span> <span class="muted">left after this month's bills</span>`:'<span class="grn">Every bill this month is paid</span>';
 $('mName').textContent=mon;$('dueLeft').textContent=money(left);$('toEarn').textContent=money(gap);
 $('duePill').textContent=unp.length?unp.length+' left':'All paid';$('duePill').className='pill'+(unp.length?'':' grn');
 $('dueBar').style.width=(tot?(tot-left)/tot*100:0)+'%';$('dueLbl').textContent=tot?money(tot-left)+' of '+money(tot)+' paid':'No bills this month';
 const recent=S.shifts.slice(0,10),avg=recent.length?recent.reduce((s,x)=>s+net(x),0)/recent.length:0;
 $('shiftsNeed').innerHTML=gap&&avg?`About <strong class="pos">${Math.ceil(gap/avg)} shifts</strong> to cover it at your usual ${money(avg)} a shift`:gap?'Log a few shifts to see how many you need':'';
 $('dueCnt').textContent=unp.length;
 $('dueList').innerHTML=unp.map(o=>`<div class="li row"><div><strong>${esc(o.b.name)}</strong><div class="small ${o.date<isoD(today)?'neg':'muted'}">${o.date<isoD(today)?'Past due · ':'Due '}${fd(o.date)}</div></div><div class="row" style="gap:10px"><strong>${money(o.b.amount)}</strong><button class="btn sm primary" onclick="payBill('${o.b.id}','${o.date}')">Pay</button></div></div>`).join('')||'<div class="empty">Nothing left to pay this month.</div>';
 const sh=S.shifts.filter(s=>s.date>=ms&&s.date<=me);
 $('mShifts').textContent=sh.length+(sh.length===1?' shift':' shifts');$('mTips').textContent=money(sh.reduce((s,x)=>s+x.cash+x.credit,0));$('mNet').textContent=money(sh.reduce((s,x)=>s+net(x),0));
 // shifts page
 $('sMonth').textContent=money(sh.reduce((s,x)=>s+net(x),0));
 const hrs=S.shifts.reduce((s,x)=>s+x.hours,0),tips=S.shifts.reduce((s,x)=>s+x.cash+x.credit,0);$('sTH').textContent=money(hrs?tips/hrs:0);
 $('sCnt').textContent=S.shifts.length+' logged';
 $('shList').innerHTML=S.shifts.slice(0,60).map(s=>`<div class="li"><div class="row"><div><strong>${fd(s.date)}</strong><div class="muted small">${s.hours}h · Cash ${money(s.cash)} · Credit ${money(s.credit)}</div></div><strong class="pos">${money(net(s))}</strong></div><div class="actions" style="margin-top:9px"><button class="btn sm" onclick="shiftSheet('${s.id}')">Edit</button><button class="btn sm danger" onclick="delShift('${s.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No shifts yet. Tap “Log a shift”.</div>';
 // bills page
 $('bTot').textContent=money(tot);$('bLeft').textContent=money(left);$('bCnt').textContent=S.bills.length+' total';
 const win=allOcc(addD(today,-62),addD(today,400),false);
 $('billList').innerHTML=[...S.bills].map(x=>({x,n:win.find(o=>o.b.id===x.id&&!o.paid),p:win.filter(o=>o.b.id===x.id&&o.paid).pop()})).sort((a,c)=>(a.n?.date||'9').localeCompare(c.n?.date||'9')).map(({x,n,p})=>`<div class="li"><div class="row"><div><strong>${esc(x.name)}</strong><div class="muted small">${money(x.amount)} · ${x.repeat==='once'?'one time':x.repeat==='weekly'?'weekly':'monthly'} · ${n?'next '+fd(n.date):'all paid'}</div></div>${n?`<button class="btn sm primary" onclick="payBill('${x.id}','${n.date}')">Pay</button>`:'<span class="pill grn">Paid</span>'}</div><div class="actions" style="margin-top:9px">${p?`<button class="btn sm" onclick="unpayBill('${x.id}','${p.date}')">Undo paid</button>`:''}<button class="btn sm" onclick="billSheet('${x.id}')">Edit</button><button class="btn sm danger" onclick="delBill('${x.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No bills yet. Tap “Add a bill”.</div>';
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){today=new Date();renderAll()}});
if(sessionStorage.getItem('sm_in'))$('splash').style.display='none';
load();renderAll();
</script>
</body>
</html>
